<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SysON viewer documentation preview</title>
    <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5f3;
      color: #171917;
    }
    main {
      width: min(var(--viewer-width, 760px), calc(100vw - 48px));
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #5d655e;
      font-size: 13px;
      letter-spacing: .01em;
    }
    .legend strong {
      color: #47614d;
      background: #e5efe7;
      border: 1px solid #c8dacb;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    /* The viewer frames itself and reports its height; the page only lends it the ground. */
    iframe {
      display: block;
      width: 100%;
      height: 120px;
      border: 0;
    }
    </style>
  </head>
  <body>
    <main>
      <p class="legend"><strong>Fixture</strong> Contract preview — not execution evidence</p>
      <iframe id="viewer"></iframe>
    </main>
    <script type="module">
    // ?view= picks one committed fixture; anything else is the requirements one.
    const VIEWS = {
      requirements: {
        title: "SysON requirements viewer",
        bundle: "requirements-viewer",
        session: "./requirements-session.json",
        width: 760,
        maxHeight: 640,
      },
      // A canvas fills what the host gives: a fixed height, set from the start.
      diagram: {
        title: "SysON diagram viewer",
        bundle: "diagram-viewer",
        session: "./diagram-session.json",
        width: 760,
        maxHeight: 1120,
        height: 1120,
      },
    };
    const view = VIEWS[new URLSearchParams(location.search).get("view")] ??
      VIEWS.requirements;
    document.title = `${view.title} documentation preview`;
    document.documentElement.style.setProperty("--viewer-width", `${view.width}px`);
    const viewer = document.querySelector("#viewer");
    viewer.title = view.title;
    viewer.src = `../../src/ui/dist/${view.bundle}/index.html`;
    if (view.height) viewer.style.height = `${view.height}px`;
    // Listen before the fixture arrives: the bundle may initialize first.
    const session = fetch(view.session).then((response) => {
      if (!response.ok) throw new Error(`Fixture HTTP ${response.status}`);
      return response.json();
    });
    const MAX_HEIGHT = view.maxHeight;
    let initialized = false;
    window.addEventListener("message", async (event) => {
      if (event.source !== viewer.contentWindow) return;
      const message = event.data;
      if (message?.jsonrpc !== "2.0") return;
      if (message.method === "ui/initialize" && message.id !== undefined) {
        viewer.contentWindow.postMessage({
          jsonrpc: "2.0",
          id: message.id,
          result: {
            protocolVersion: message.params.protocolVersion,
            hostInfo: { name: "SysON documentation harness", version: "1.0.0" },
            // Context updates are accepted (and dropped), like a host that
            // keeps the selection for the model.
            hostCapabilities: {
              updateModelContext: { structuredContent: {}, text: {} },
            },
            hostContext: {
              theme: "light",
              displayMode: "inline",
              containerDimensions: view.height
                ? { width: view.width, height: view.height }
                : { width: view.width, maxHeight: MAX_HEIGHT },
              locale: "en-US",
              platform: "web",
            },
          },
        }, "*");
        return;
      }
      if (message.method === "ui/update-model-context" && message.id !== undefined) {
        viewer.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
        return;
      }
      if (message.method === "ui/notifications/size-changed") {
        // Follow the App's reported height up to the container limit, like a host does.
        const height = message.params?.height;
        if (typeof height === "number" && !view.height) {
          viewer.style.height = `${Math.min(Math.ceil(height), MAX_HEIGHT)}px`;
        }
        return;
      }
      if (message.method === "ui/notifications/initialized" && !initialized) {
        initialized = true;
        viewer.contentWindow.postMessage({
          jsonrpc: "2.0",
          method: "ui/compose/event",
          params: { action: "viewer.session.apply", data: await session },
        }, "*");
        document.documentElement.dataset.viewerReady = "true";
      }
    });
    </script>
  </body>
</html>

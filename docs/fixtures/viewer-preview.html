<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SysON viewer documentation preview</title>
    <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --ground: #f4f5f3;
      --ink: #171917;
      --quiet: #5d655e;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ground: #0d0f0e;
      --ink: #e8ebe8;
      --quiet: #9aa39b;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--ground);
      color: var(--ink);
    }
    main {
      width: min(var(--viewer-width, 760px), calc(100vw - 48px));
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: var(--quiet);
      font-size: 13px;
      letter-spacing: .01em;
    }
    .legend strong {
      color: #47614d;
      background: #e5efe7;
      border: 1px solid #c8dacb;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    /* Captures show the viewer alone. */
    :root[data-capture] .legend {
      display: none;
    }
    /* The viewer frames itself and reports its height; the page only lends it the ground. */
    iframe {
      display: block;
      width: 100%;
      height: 120px;
      border: 0;
    }
    </style>
  </head>
  <body>
    <main>
      <p class="legend"><strong>Fixture</strong> Recorded session, rendered by the committed viewer bundle</p>
      <iframe id="viewer"></iframe>
    </main>
    <script type="module">
    // ?view= picks one committed fixture (anything else is the requirements
    // one); ?theme=dark, ?capture hides the legend. Diagram views may open in
    // the automatic layout, chosen through the viewer's own menu.
    const diagram = (name, title, size) => ({
      title,
      bundle: "diagram-viewer",
      session: `./diagram-${name}-session.json`,
      ...size,
    });
    const VIEWS = {
      requirements: {
        title: "SysON requirements viewer",
        bundle: "requirements-viewer",
        session: "./requirements-session.json",
        width: 760,
        maxHeight: 640,
      },
      "action-flow": diagram("action-flow", "SysON action flow", {
        width: 1180,
        height: 760,
        layout: "auto",
      }),
      "state-transition": diagram("state-transition", "SysON state machine", {
        width: 760,
        height: 980,
        layout: "auto",
      }),
      interconnection: diagram("interconnection", "SysON interconnection", {
        width: 760,
        height: 980,
      }),
    };
    const params = new URLSearchParams(location.search);
    const view = VIEWS[params.get("view")] ?? VIEWS.requirements;
    const theme = params.get("theme") === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
    if (params.has("capture")) document.documentElement.dataset.capture = "";
    document.title = `${view.title} documentation preview`;
    document.documentElement.style.setProperty("--viewer-width", `${view.width}px`);
    const viewer = document.querySelector("#viewer");
    viewer.title = view.title;
    viewer.src = `../../src/ui/dist/${view.bundle}/index.html`;
    // A canvas fills what the host gives: a fixed height, set from the start.
    if (view.height) viewer.style.height = `${view.height}px`;
    // Listen before the fixture arrives: the bundle may initialize first.
    const session = fetch(view.session).then((response) => {
      if (!response.ok) throw new Error(`Fixture HTTP ${response.status}`);
      return response.json();
    });
    const MAX_HEIGHT = view.maxHeight ?? view.height;
    const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function waitFor(find, tries = 200) {
      for (let attempt = 0; attempt < tries; attempt++) {
        const found = find();
        if (found) return found;
        await pause(50);
      }
      return undefined;
    }
    /**
     * Choose a layout through the viewer's "⋯" menu, as a person would, and
     * fold the overview map a capture would show over the drawing.
     */
    async function chooseLayout(layout) {
      const doc = viewer.contentDocument;
      if (!doc || !await waitFor(() => doc.querySelector(".syson-diagram-svg"))) return;
      if (document.documentElement.dataset.capture !== undefined) {
        doc.querySelector('.syson-diagram-control-minimap[aria-pressed="true"]')?.click();
      }
      if (!layout || layout === "syson") return;
      doc.querySelector(".syson-menu-button")?.click();
      const option = await waitFor(() =>
        doc.querySelector(`[role="menuitemradio"][data-option="${layout}"]`)
      );
      option?.click();
      await waitFor(() =>
        doc.querySelector(`.syson-diagram-svg[data-layout="${layout}"]`)
      );
      doc.activeElement?.blur();
      await pause(300);
    }
    let initialized = false;
    window.addEventListener("message", async (event) => {
      if (event.source !== viewer.contentWindow) return;
      const message = event.data;
      if (message?.jsonrpc !== "2.0") return;
      if (message.method === "ui/initialize" && message.id !== undefined) {
        viewer.contentWindow.postMessage({
          jsonrpc: "2.0",
          id: message.id,
          result: {
            protocolVersion: message.params.protocolVersion,
            hostInfo: { name: "SysON documentation harness", version: "1.0.0" },
            // Context updates are accepted (and dropped), like a host that
            // keeps the selection for the model.
            hostCapabilities: {
              updateModelContext: { structuredContent: {}, text: {} },
            },
            hostContext: {
              theme,
              displayMode: "inline",
              containerDimensions: view.height
                ? { width: view.width, height: view.height }
                : { width: view.width, maxHeight: MAX_HEIGHT },
              locale: "en-US",
              platform: "web",
            },
          },
        }, "*");
        return;
      }
      if (message.method === "ui/update-model-context" && message.id !== undefined) {
        viewer.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
        return;
      }
      if (message.method === "ui/notifications/size-changed") {
        // Follow the App's reported height up to the container limit, like a host does.
        const height = message.params?.height;
        if (typeof height === "number" && !view.height) {
          viewer.style.height = `${Math.min(Math.ceil(height), MAX_HEIGHT)}px`;
        }
        return;
      }
      if (message.method === "ui/notifications/initialized" && !initialized) {
        initialized = true;
        viewer.contentWindow.postMessage({
          jsonrpc: "2.0",
          method: "ui/compose/event",
          params: { action: "viewer.session.apply", data: await session },
        }, "*");
        if (view.bundle === "diagram-viewer") await chooseLayout(view.layout);
        document.documentElement.dataset.viewerReady = "true";
      }
    });
    </script>
  </body>
</html>

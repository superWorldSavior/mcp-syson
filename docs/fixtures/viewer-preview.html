<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SysON viewer documentation preview</title>
    <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --ground: #f4f5f3;
      --ink: #171917;
      --quiet: #5d655e;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ground: #0d0f0e;
      --ink: #e8ebe8;
      --quiet: #9aa39b;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--ground);
      color: var(--ink);
    }
    main {
      width: min(var(--viewer-width, 760px), calc(100vw - 48px));
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: var(--quiet);
      font-size: 13px;
      letter-spacing: .01em;
    }
    .legend strong {
      color: #47614d;
      background: #e5efe7;
      border: 1px solid #c8dacb;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    /* Captures show the viewer alone. */
    :root[data-capture] .legend {
      display: none;
    }
    /* The viewer frames itself and reports its height; the page only lends it the ground. */
    iframe {
      display: block;
      width: 100%;
      height: 120px;
      border: 0;
    }
    </style>
  </head>
  <body>
    <main>
      <p class="legend"><strong>Fixture</strong> Recorded result, rendered by the committed viewer bundle</p>
      <iframe id="viewer"></iframe>
    </main>
    <script type="module">
    // ?view= picks one committed fixture (none: the requirements one; an
    // unknown name is an error); ?theme=dark, ?capture hides the legend.
    // Diagram views may open in the automatic layout, chosen through the
    // viewer's own menu.
    // A view is either a recorded session (`session`) or a recorded tool
    // result (`result`).
    const diagram = (name, title, size) => ({
      title,
      bundle: "diagram-viewer",
      session: `./diagram-${name}-session.json`,
      ...size,
    });
    // A tool result recorded on the live audit project, delivered as a host
    // delivers one. The viewer may call the tools in `calls` back: each gets
    // its recorded result (live-audit/<tool>.json) when it is about the
    // element asked for. A list viewer reports its height; the host lends it
    // up to maxHeight.
    const live = (name, title, recording, calls = []) => ({
      title,
      bundle: `${name}-viewer`,
      result: `../../tests/fixtures/live-audit/${recording}.json`,
      calls,
      width: 760,
      maxHeight: 640,
    });
    const VIEWS = {
      requirements: {
        title: "SysON requirements viewer",
        bundle: "requirements-viewer",
        session: "./requirements-session.json",
        width: 760,
        maxHeight: 640,
      },
      "model-explorer": live(
        "model-explorer",
        "SysON model explorer",
        "syson_element_children",
      ),
      "query-results": live(
        "query-results",
        "SysON query results",
        "syson_query_eval",
      ),
      "value-change": live(
        "value-change",
        "SysON value change",
        "syson_value_set",
        ["syson_element_get"],
      ),
      "requirements-trace": live(
        "requirements-trace",
        "SysON requirements trace",
        "syson_query_requirements_trace",
      ),
      validation: live(
        "validation",
        "SysON validation",
        "syson_constraint_validate_drone_budget",
      ),
      "action-flow": diagram("action-flow", "SysON action flow", {
        width: 1180,
        height: 760,
        layout: "auto",
      }),
      "state-transition": diagram("state-transition", "SysON state machine", {
        width: 760,
        height: 980,
        layout: "auto",
      }),
      interconnection: diagram("interconnection", "SysON interconnection", {
        width: 760,
        height: 980,
      }),
    };
    const params = new URLSearchParams(location.search);
    const viewName = params.get("view") ?? "requirements";
    const view = VIEWS[viewName] ?? VIEWS.requirements;
    /** Say why the page cannot be captured; the first reason wins. */
    const fail = (reason) => {
      document.documentElement.dataset.viewerError ??= reason;
    };
    if (!VIEWS[viewName]) fail(`unknown view ${viewName}`);
    const theme = params.get("theme") === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
    if (params.has("capture")) document.documentElement.dataset.capture = "";
    document.title = `${view.title} documentation preview`;
    document.documentElement.style.setProperty("--viewer-width", `${view.width}px`);
    const viewer = document.querySelector("#viewer");
    viewer.title = view.title;
    viewer.src = `../../src/ui/dist/${view.bundle}/index.html`;
    // A canvas fills what the host gives: a fixed height, set from the start.
    if (view.height) viewer.style.height = `${view.height}px`;
    const fixture = (path) =>
      fetch(path).then((response) => {
        if (!response.ok) throw new Error(`Fixture HTTP ${response.status}`);
        return response.json();
      });
    // Listen before the fixture arrives: the bundle may initialize first.
    const recorded = fixture(view.session ?? view.result);
    recorded.catch((error) => fail(`fixture: ${error.message}`));
    const notRecorded = (name) => ({
      isError: true,
      content: [{ type: "text", text: `${name} is not recorded for this preview.` }],
    });
    /**
     * The recorded result of a call back, when it is about the element asked
     * for. A recording that cannot be read fails the capture.
     */
    async function recordedCall(name, args) {
      if (!view.calls?.includes(name)) return notRecorded(name);
      try {
        const result = await fixture(`../../tests/fixtures/live-audit/${name}.json`);
        const about = result.structuredContent?.id ?? result.structuredContent?.parentId;
        return about && about === args?.element_id ? result : notRecorded(name);
      } catch (error) {
        fail(`${name} recording: ${error.message}`);
        return notRecorded(name);
      }
    }
    /** Calls back still being answered; the page is not ready while one is. */
    const answering = new Set();
    const MAX_HEIGHT = view.maxHeight ?? view.height;
    const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function waitFor(find, tries = 200) {
      for (let attempt = 0; attempt < tries; attempt++) {
        const found = find();
        if (found) return found;
        await pause(50);
      }
      return undefined;
    }
    /**
     * Prepare a diagram as a person would: fold the overview map a capture
     * would show over the drawing, then choose the layout through the
     * viewer's "⋯" menu. Returns why it could not, if it could not.
     */
    async function prepareDiagram(doc, layout) {
      if (!await waitFor(() => doc.querySelector(".syson-diagram-svg"))) {
        return "no client drawing";
      }
      if (document.documentElement.dataset.capture !== undefined) {
        doc.querySelector('.syson-diagram-control-minimap[aria-pressed="true"]')?.click();
      }
      if (!layout || layout === "syson") return undefined;
      doc.querySelector(".syson-menu-button")?.click();
      const option = await waitFor(() =>
        doc.querySelector(`[role="menuitemradio"][data-option="${layout}"]`)
      );
      if (!option) return `no ${layout} layout option`;
      option.click();
      if (!await waitFor(() => doc.querySelector(`.syson-diagram-svg[data-layout="${layout}"]`))) {
        return `${layout} layout not drawn`;
      }
      doc.activeElement?.blur();
      await pause(300);
      return undefined;
    }
    /**
     * Ready once the viewer shows its title (and a diagram its layout) and
     * every call back it made has its answer.
     */
    async function settle() {
      const doc = viewer.contentDocument;
      const titled = doc && await waitFor(() => doc.querySelector(".syson-viewer-title"));
      const error = !titled
        ? "no viewer title"
        : view.bundle === "diagram-viewer"
        ? await prepareDiagram(doc, view.layout)
        : undefined;
      if (error) fail(error);
      // A viewer asks for what it shows once it has drawn: give it a moment.
      await pause(100);
      while (answering.size > 0) await Promise.allSettled([...answering]);
      if (document.documentElement.dataset.viewerError === undefined) {
        document.documentElement.dataset.viewerReady = "true";
      }
    }
    let initialized = false;
    window.addEventListener("message", async (event) => {
      if (event.source !== viewer.contentWindow) return;
      const message = event.data;
      if (message?.jsonrpc !== "2.0") return;
      if (message.method === "ui/initialize" && message.id !== undefined) {
        viewer.contentWindow.postMessage({
          jsonrpc: "2.0",
          id: message.id,
          result: {
            protocolVersion: message.params.protocolVersion,
            hostInfo: { name: "SysON documentation harness", version: "1.0.0" },
            // Context updates are accepted (and dropped), like a host that
            // keeps the selection for the model.
            hostCapabilities: {
              updateModelContext: { structuredContent: {}, text: {} },
              ...(view.result ? { serverTools: {} } : {}),
            },
            hostContext: {
              theme,
              displayMode: "inline",
              containerDimensions: view.height
                ? { width: view.width, height: view.height }
                : { width: view.width, maxHeight: MAX_HEIGHT },
              locale: "en-US",
              platform: "web",
            },
          },
        }, "*");
        return;
      }
      if (message.method === "tools/call" && message.id !== undefined) {
        const { name, arguments: args } = message.params ?? {};
        const answer = recordedCall(name, args);
        answering.add(answer);
        const result = await answer;
        viewer.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result }, "*");
        answering.delete(answer);
        return;
      }
      if (message.method === "ui/update-model-context" && message.id !== undefined) {
        viewer.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
        return;
      }
      if (message.method === "ui/notifications/size-changed") {
        // Follow the App's reported height up to the container limit, like a host does.
        const height = message.params?.height;
        if (typeof height === "number" && !view.height) {
          viewer.style.height = `${Math.min(Math.ceil(height), MAX_HEIGHT)}px`;
        }
        return;
      }
      if (message.method === "ui/notifications/initialized" && !initialized) {
        initialized = true;
        // An unreadable fixture already failed the page (see `recorded`).
        const data = await recorded.catch(() => undefined);
        if (data === undefined) return;
        viewer.contentWindow.postMessage(
          view.session
            ? {
              jsonrpc: "2.0",
              method: "ui/compose/event",
              params: { action: "viewer.session.apply", data },
            }
            : { jsonrpc: "2.0", method: "ui/notifications/tool-result", params: data },
          "*",
        );
        await settle();
      }
    });
    </script>
  </body>
</html>

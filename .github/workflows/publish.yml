name: Verify and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/superworldsavior/mcp-syson

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MCP_VIEW_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view/mod.ts
      MCP_VIEW_COMPONENTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-components/mod.ts
    steps:
      - uses: actions/checkout@v5

      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .deps/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"

      - name: Build UI viewers from the locked dependency graph
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Verify committed UI bundles
        run: |
          deno task ui:check
          deno task ui:verify
          git diff --exit-code -- src/ui/bundles.ts

      - name: Install the image's solver dependency
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Check formatting and types
        run: |
          deno task fmt
          deno task lint
          deno task check

      - name: Run provider tests
        run: deno task test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    env:
      MCP_VIEW_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view/mod.ts
      MCP_VIEW_COMPONENTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-components/mod.ts
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .deps/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"

      - name: Bind the release tag to deno.json
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          test -n "$VERSION"
          test "$(deno eval --frozen 'console.log(JSON.parse(await Deno.readTextFile("deno.json")).version)')" = "$VERSION"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build locked UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs
          cd ../..
          deno task ui:verify
          git diff --exit-code -- src/ui/bundles.ts

      - name: Verify the exact JSR package can publish
        run: |
          npx jsr publish --dry-run

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable image coordinates
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="$REGISTRY_IMAGE"
          printf 'name=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Build, attest and publish dedicated multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.image.outputs.created }}
          provenance: mode=max
          sbom: true

      - name: Smoke the published image over HTTP and stdio
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.image.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          IMAGE="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$IMAGE"
          docker run --detach --rm --name mcp-syson-smoke --publish 127.0.0.1:3009:3009 "$IMAGE"
          trap 'docker logs mcp-syson-smoke || true; docker stop mcp-syson-smoke || true' EXIT
          READY=false
          for attempt in $(seq 1 30); do
            STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:3009/mcp || true)"
            if test "$STATUS" = 405; then
              READY=true
              break
            fi
            sleep 1
          done
          test "$READY" = true
          deno run --frozen --allow-net --allow-run --allow-write scripts/smoke-oci-image.ts \
            --image "$IMAGE" \
            --http-url http://127.0.0.1:3009/mcp \
            --version "$VERSION" \
            --revision "$REVISION" \
            --image-digest "$IMAGE_DIGEST" \
            --output "$RUNNER_TEMP/release-runtime-contract.json"

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-syson-runtime-contract-${{ steps.image.outputs.version }}
          path: ${{ runner.temp }}/release-runtime-contract.json
          if-no-files-found: error

      - name: Qualify the published provider against the reviewed SysON runtime
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.image.outputs.version }}
          REVISION: ${{ github.sha }}
          QUALIFICATION_MCP_PORT: "3010"
          RELEASE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          QUALIFICATION_SYSON_PORT: "3011"
          QUALIFICATION_POSTGRES_IMAGE: postgres@sha256:c9d304da25223a60a3b3c5ec77b599c59f4a6088950ee612fdb5115d713d100d
          QUALIFICATION_SYSON_IMAGE: eclipsesyson/syson@sha256:c1f457ed236757f717ea1c9f79f0c950be8d79db89f3f265a81a7310200bb690
        run: |
          QUALIFICATION_MCP_SYSON_IMAGE="${IMAGE_NAME}@${IMAGE_DIGEST}"
          QUALIFICATION_PROJECT="mcp-syson-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export QUALIFICATION_MCP_SYSON_IMAGE QUALIFICATION_PROJECT
          cleanup() {
            STATUS=$?
            docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml logs --no-color || true
            if ! docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml down --volumes --remove-orphans; then
              STATUS=1
            fi
            trap - EXIT
            exit "$STATUS"
          }
          trap cleanup EXIT
          docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml config > "$RUNNER_TEMP/mcp-syson-qualification-compose.yml"
          docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml pull
          docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml up --detach --wait --wait-timeout 600
          QUALIFICATION_MCP_CONTAINER="$(docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml ps --quiet mcp-syson)"
          QUALIFICATION_SYSON_CONTAINER="$(docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml ps --quiet syson)"
          QUALIFICATION_DATABASE_CONTAINER="$(docker compose --project-name "$QUALIFICATION_PROJECT" --file docker-compose.qualification.yml ps --quiet database)"
          test -n "$QUALIFICATION_MCP_CONTAINER"
          test -n "$QUALIFICATION_SYSON_CONTAINER"
          test -n "$QUALIFICATION_DATABASE_CONTAINER"
          READY=false
          for attempt in $(seq 1 60); do
            STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 "http://127.0.0.1:${QUALIFICATION_MCP_PORT}/mcp" || true)"
            if test "$STATUS" = 405; then
              READY=true
              break
            fi
            sleep 1
          done
          test "$READY" = true
          deno run --frozen --allow-net --allow-read --allow-run --allow-write scripts/qualify-syson-runtime.ts \
            --http-url "http://127.0.0.1:${QUALIFICATION_MCP_PORT}/mcp" \
            --syson-url "http://127.0.0.1:${QUALIFICATION_SYSON_PORT}" \
            --mcp-container "$QUALIFICATION_MCP_CONTAINER" \
            --syson-container "$QUALIFICATION_SYSON_CONTAINER" \
            --database-container "$QUALIFICATION_DATABASE_CONTAINER" \
            --mcp-image "$QUALIFICATION_MCP_SYSON_IMAGE" \
            --mcp-image-digest "$IMAGE_DIGEST" \
            --syson-image "$QUALIFICATION_SYSON_IMAGE" \
            --syson-image-digest sha256:c1f457ed236757f717ea1c9f79f0c950be8d79db89f3f265a81a7310200bb690 \
            --database-image "$QUALIFICATION_POSTGRES_IMAGE" \
            --database-image-digest sha256:c9d304da25223a60a3b3c5ec77b599c59f4a6088950ee612fdb5115d713d100d \
            --version "$VERSION" \
            --revision "$REVISION" \
            --expected-source "$RELEASE_SOURCE" \
            --runtime-contract "$RUNNER_TEMP/release-runtime-contract.json" \
            --output "$RUNNER_TEMP/release-runtime-qualification.json"

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-syson-runtime-qualification-${{ steps.image.outputs.version }}
          path: ${{ runner.temp }}/release-runtime-qualification.json
          if-no-files-found: error

      - name: Publish the exact JSR package after image smoke and SysON qualification
        run: npx jsr publish

      - name: Publish release evidence bound to tag, commit and image digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-runtime-contract.json" "$RUNNER_TEMP/release-runtime-qualification.json" \
            --title "mcp-syson $VERSION" \
            --notes "Published $IMAGE_NAME@$IMAGE_DIGEST after HTTP/stdio smoke and bounded SysON provider-compatibility qualification. The qualification is not a Digital Thread seal, MRTR approval, or architecture verdict."
